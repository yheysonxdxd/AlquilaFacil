spring.application.name=alquila-facil
spring.main.web-application-type=none
spring.main.banner-mode=off

app.carpeta=.
spring.datasource.url=jdbc:sqlite:${app.carpeta}/alquileres.db
app.fotos.carpeta=${app.carpeta}/fotos
app.respaldos.carpeta=${app.carpeta}/respaldos
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.alquilafacil.config.YCEstrategiaNombres

logging.level.root=WARN
logging.level.com.alquilafacil=INFO
logging.file.name=${app.carpeta}/logs/hospedaje.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=100MB

app.seeder.enabled=false

app.arrendador.nombre=Nombre del Propietario
app.arrendador.dni=
app.arrendador.direccion=Av. Principal 123
app.arrendador.telefono=
app.dni.url=https://api.decolecta.com/v1/reniec/dni?numero={dni}
app.dni.token=

spring.config.import=optional:file:${app.carpeta}/configuracion.properties

app.arrendador.nombre-hospedaje=Hospedaje Supply
app.arrendador.nombre-sistema=Hospedaje Supply
app.arrendador.hora-limite-llegada=20:00

app.arrendador.tasa-impuesto-alquiler=5
